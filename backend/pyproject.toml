[project]
name = "hextrade"
version = "0.1.0"
description = "NIFTY and SENSEX option-chain analysis with paper trading and a gated live path"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pyodbc>=5.1",
  "pydantic-settings>=2.6",
  "kiteconnect>=5.0",
  "cryptography>=43",
  "redis>=5.2",
  "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
